                return i;
            }

            private void addTitle(LinearLayout p, String txt) {
                LinearLayout row = new LinearLayout(this);
                row.setOrientation(LinearLayout.HORIZONTAL);
                row.setGravity(Gravity.CENTER_VERTICAL);
                row.setPadding(0, 0, 0, dp(10));
                View bar = new View(this);
                LinearLayout.LayoutParams bl = new LinearLayout.LayoutParams(dp(4), dp(22));
                bl.setMargins(0, 0, dp(10), 0);
                bar.setLayoutParams(bl);
                GradientDrawable bg = new GradientDrawable();
                bg.setColor(COLOR_PRIMARY); bg.setCornerRadius(dp(2));
                bar.setBackground(bg);
                row.addView(bar);
                TextView tv = new TextView(this);
                tv.setText(txt); tv.setTextSize(17); tv.setTextColor(COLOR_PRIMARY);
                tv.setTypeface(null, Typeface.BOLD);
                row.addView(tv);
                p.addView(row);
            }

            private void addRow(LinearLayout p, String k, String v) {
                LinearLayout row = new LinearLayout(this);
                row.setOrientation(LinearLayout.HORIZONTAL);
                row.setPadding(0, dp(5), 0, dp(5));
                TextView kk = new TextView(this);
                kk.setText(k); kk.setTextSize(13); kk.setTextColor(COLOR_TEXT_DIM);
                kk.setMinWidth(dp(80));
                row.addView(kk);
                TextView sep = new TextView(this);
                sep.setText(" · "); sep.setTextSize(13); sep.setTextColor(Color.parseColor("#2A2A2A"));
                row.addView(sep);
                TextView vv = new TextView(this);
                vv.setText(v); vv.setTextSize(13); vv.setTextColor(COLOR_TEXT);
                vv.setTypeface(null, Typeface.BOLD);
                row.addView(vv);
                p.addView(row);
            }

            private Button makeBtn(String text, int bgColor, int textColor) {
                Button b = new Button(this);
                b.setText(text); b.setTextColor(textColor);
                b.setTextSize(14); b.setTypeface(null, Typeface.BOLD);
                if (bgColor == COLOR_PRIMARY) {
                    GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                            new int[]{COLOR_PRIMARY, COLOR_PRIMARY_DARK});
                    g.setCornerRadius(dp(10));
                    b.setBackground(g);
                } else {
                    GradientDrawable g = new GradientDrawable();
                    g.setColor(COLOR_CARD);
                    g.setCornerRadius(dp(10));
                    b.setBackground(g);
                }
                return b;
            }

            private GradientDrawable outlineBg() {
                GradientDrawable g = new GradientDrawable();
                g.setColor(COLOR_BG);
                g.setCornerRadius(dp(10));
                g.setStroke(dp(1), COLOR_PRIMARY);
                return g;
            }

            private GradientDrawable inputBg() {
                GradientDrawable g = new GradientDrawable();
                g.setColor(COLOR_BG);
                g.setCornerRadius(dp(8));
                g.setStroke(dp(1), Color.parseColor("#2A2A2A"));
                return g;
            }

            private GradientDrawable monoBg() {
                GradientDrawable g = new GradientDrawable();
                g.setColor(COLOR_BG);
                g.setCornerRadius(dp(8));
                g.setStroke(dp(1), Color.parseColor("#2A2A2A"));
                return g;
            }

            private void addGap(LinearLayout p, int h) {
                View v = new View(this);
                v.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(h)));
                p.addView(v);
            }

            private void addGapH(LinearLayout p, int w) {
                View v = new View(this);
                v.setLayoutParams(new LinearLayout.LayoutParams(dp(w), LinearLayout.LayoutParams.MATCH_PARENT));
                p.addView(v);
            }

            private void anim(View v) {
                ScaleAnimation sa = new ScaleAnimation(1f, 0.95f, 1f, 0.95f,
                        ScaleAnimation.RELATIVE_TO_SELF, 0.5f, ScaleAnimation.RELATIVE_TO_SELF, 0.5f);
                sa.setDuration(100);
                sa.setRepeatCount(1);
                sa.setRepeatMode(ScaleAnimation.REVERSE);
                v.startAnimation(sa);
            }

            private void addHeader(String title, String sub) {
                LinearLayout hdr = new LinearLayout(this);
                hdr.setOrientation(LinearLayout.HORIZONTAL);
                hdr.setGravity(Gravity.CENTER_VERTICAL);
                hdr.setPadding(dp(12), dp(14), dp(12), dp(14));
                GradientDrawable hb = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                        new int[]{darken(COLOR_PRIMARY, 0.7f), darken(COLOR_PRIMARY, 0.85f)});
                hb.setCornerRadius(dp(16));
                hb.setStroke(dp(1), COLOR_PRIMARY);
                hdr.setBackground(hb);
                LinearLayout ht = new LinearLayout(this);
                ht.setOrientation(LinearLayout.VERTICAL);
                TextView t1 = new TextView(this);
                t1.setText(title); t1.setTextSize(22); t1.setTextColor(COLOR_PRIMARY);
                t1.setTypeface(null, Typeface.BOLD);
                ht.addView(t1);
                TextView t2 = new TextView(this);
                t2.setText(sub); t2.setTextSize(11); t2.setTextColor(lighten(COLOR_PRIMARY, 0.3f));
                ht.addView(t2);
                hdr.addView(ht);
                contentArea.addView(hdr);
                addGap(contentArea, 12);
            }

            private int darken(int color, float factor) {
                return Color.rgb((int)(Color.red(color)*factor),
                        (int)(Color.green(color)*factor),
                        (int)(Color.blue(color)*factor));
            }
            private int lighten(int color, float add) {
                return Color.rgb(Math.min(255,(int)(Color.red(color)+255*add)),
                        Math.min(255,(int)(Color.green(color)+255*add)),
                        Math.min(255,(int)(Color.blue(color)+255*add)));
            }
        }
