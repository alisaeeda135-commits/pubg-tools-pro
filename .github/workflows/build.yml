            private void anim(View v) {
                ScaleAnimation sa = new ScaleAnimation(1f, 0.95f, 1f, 0.95f,
                        ScaleAnimation.RELATIVE_TO_SELF, 0.5f, ScaleAnimation.RELATIVE_TO_SELF, 0.5f);
                sa.setDuration(100);
                sa.setRepeatCount(1);
                sa.setRepeatMode(ScaleAnimation.REVERSE);
                v.startAnimation(sa);
            }

            private String shOut(String cmd) {
                try {
                    Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", cmd});
                    BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                    StringBuilder sb = new StringBuilder();
                    String l;
                    while ((l = r.readLine()) != null) sb.append(l).append("\n");
                    p.waitFor();
                    return sb.toString();
                } catch (Throwable t) { return ""; }
            }

            private void fillNet(TextView tv) {
                try {
                    ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                    NetworkInfo ni = cm.getActiveNetworkInfo();
                    StringBuilder sb = new StringBuilder();
                    if (ni != null && ni.isConnected()) sb.append("النوع: ").append(ni.getTypeName()).append("\n");
                    else sb.append("غير متصل\n");
                    WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                    if (wm != null && wm.isWifiEnabled()) {
                        WifiInfo wi = wm.getConnectionInfo();
                        if (wi != null) sb.append("WiFi: ").append(wi.getSSID()).append("\n");
                    }
                    tv.setText(sb.toString());
                } catch (Throwable ignored) {}
            }

            private String computeSens(int dpi, int idx) {
                double sf; String sn;
                switch (idx) {
                    case 0: sf = 1.15; sn = "2 أصابع"; break;
                    case 1: sf = 1.05; sn = "3 أصابع"; break;
                    case 2: sf = 0.95; sn = "4 أصابع"; break;
                    case 3: sf = 0.88; sn = "5 أصابع"; break;
                    case 4: sf = 0.80; sn = "جيروسكوب"; break;
                    default: sf = 1.0; sn = "-";
                }
                double df = 450.0 / dpi;
                StringBuilder sb = new StringBuilder();
                sb.append("DPI: ").append(dpi).append("\n");
                sb.append("النمط: ").append(sn).append("\n─────────\n");
                sb.append("🎯 الكاميرا: ").append(clamp((int)(90*df*sf))).append("\n");
                sb.append("🎯 ADS: ").append(clamp((int)(55*df*sf))).append("\n");
                sb.append("🎯 TPP: ").append(clamp((int)(60*df*sf))).append("\n");
                sb.append("🎯 FPP: ").append(clamp((int)(65*df*sf))).append("\n");
                sb.append("🎯 الجيروسكوب: ").append(clamp((int)(300*df*sf)));
                return sb.toString();
            }
            private int clamp(int v) { return Math.max(1, Math.min(300, v)); }

