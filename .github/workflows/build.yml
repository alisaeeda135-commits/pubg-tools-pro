            private void toggleOverlay() {
                if (Build.VERSION.SDK_INT >= 23) {
                    if (!Settings.canDrawOverlays(this)) {
                        Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION);
                        i.setData(Uri.parse("package:" + getPackageName()));
                        startActivity(i);
                        toast("امنح صلاحية الرسم فوق التطبيقات");
                        return;
                    }
                }
                boolean running = prefs.getBoolean("fps_running", false);
                Intent svc = new Intent(this, FpsService.class);
                if (running) {
                    stopService(svc);
                    prefs.edit().putBoolean("fps_running", false).apply();
                    toast("تم إيقاف Overlay");
                } else {
                    startForegroundService(svc);
                    prefs.edit().putBoolean("fps_running", true).apply();
                    toast("تم تشغيل Overlay");
                }
            }

            private void gameOn() {
                final TextView out = (TextView) contentArea.findViewWithTag("gameOut");
                if (out == null) return;
                out.setText("⚡ تفعيل...");
                out.setVisibility(View.VISIBLE);
                new Thread(new Runnable() { @Override public void run() {
                    StringBuilder sb = new StringBuilder();
                    sb.append("⚡ الجيم مود\n────────\n");

                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23) {
                            if (nm.isNotificationPolicyAccessGranted()) {
                                nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                                sb.append("✓ كتم الإشعارات (الصوت يعمل)\n");
                            } else {
                                sb.append("⚠ امنح صلاحية DND\n");
                                runOnUiThread(new Runnable() { @Override public void run() {
                                    startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                                }});
                            }
                        }
                    } catch (Throwable t) { sb.append("✗ DND فشل\n"); }

                    try {
                        int max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                        audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, (max*3)/4, 0);
                        sb.append("✓ الصوت 75%\n");
                    } catch (Throwable t) { sb.append("✗ الصوت فشل\n"); }

                    try {
                        if (Build.VERSION.SDK_INT >= 23 && Settings.System.canWrite(MainActivity.this)) {
                            Settings.System.putInt(getContentResolver(),
                                    Settings.System.SCREEN_BRIGHTNESS_MODE,
                                    Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL);
                            sb.append("✓ قفل السطوع\n");
                        } else {
                            sb.append("⚠ صلاحية السطوع مطلوبة\n");
                        }
                    } catch (Throwable t) { sb.append("✗ السطوع فشل\n"); }

                    try {
                        int count = 0;
                        List<ApplicationInfo> apps = getPackageManager().getInstalledApplications(0);
                        for (ApplicationInfo ai : apps) {
                            if (ai.packageName.equals(getPackageName())) continue;
                            if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0) continue;
                            try {
                                am.killBackgroundProcesses(ai.packageName);
                                count++;
                            } catch (Throwable ignored) {}
                        }
                        sb.append("✓ killBackgroundProcesses لـ ").append(count).append(" تطبيق\n");
                    } catch (Throwable t) { sb.append("✗ فشل إغلاق التطبيقات\n"); }

                    sb.append("────────\n🎮 تم التفعيل");

                    final String r = sb.toString();
                    runOnUiThread(new Runnable() { @Override public void run() { out.setText(r); } });
                }}).start();
            }

            private void gameOff() {
                final TextView out = (TextView) contentArea.findViewWithTag("gameOut");
                if (out == null) return;
                new Thread(new Runnable() { @Override public void run() {
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23 && nm.isNotificationPolicyAccessGranted()) {
                            nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                        }
                    } catch (Throwable ignored) {}
                    try {
                        if (Build.VERSION.SDK_INT >= 23 && Settings.System.canWrite(MainActivity.this)) {
                            Settings.System.putInt(getContentResolver(),
                                    Settings.System.SCREEN_BRIGHTNESS_MODE,
                                    Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC);
                        }
                    } catch (Throwable ignored) {}
                    final String r = "✓ تم إيقاف الجيم مود";
                    runOnUiThread(new Runnable() { @Override public void run() {
                        out.setText(r); out.setVisibility(View.VISIBLE);
                    }});
                }}).start();
            }

