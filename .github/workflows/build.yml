        package com.vanta.pubgtools;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Context;
        import android.content.Intent;
        import android.graphics.Color;
        import android.graphics.PixelFormat;
        import android.graphics.Typeface;
        import android.os.Build;
        import android.os.Handler;
        import android.os.IBinder;
        import android.os.Looper;
        import android.view.Gravity;
        import android.view.View;
        import android.view.WindowManager;
        import android.widget.TextView;

        public class FpsService extends Service {

            private WindowManager wm;
            private TextView overlay;
            private Handler h = new Handler(Looper.getMainLooper());
            private Runnable ticker;
            private long lastFrame = 0;
            private int frames = 0;

            @Override
            public void onCreate() {
                super.onCreate();
                createChannel();

                Notification.Builder nb;
                if (Build.VERSION.SDK_INT >= 26) {
                    nb = new Notification.Builder(this, "fps_ch");
                } else {
                    nb = new Notification.Builder(this);
                }
                nb.setContentTitle("FPS Overlay")
                        .setContentText("يعرض FPS على الشاشة")
                        .setSmallIcon(android.R.drawable.ic_menu_info_details)
                        .setOngoing(true);

                startForeground(1002, nb.build());

                wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                overlay = new TextView(this);
                overlay.setText("FPS: --")
                        .setTextSize(12);
                overlay.setTextColor(Color.parseColor("#00FF00"));
                overlay.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                overlay.setBackgroundColor(0x80000000);
                overlay.setPadding(16, 8, 16, 8);

                int type;
                if (Build.VERSION.SDK_INT >= 26) {
                    type = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                } else {
                    type = WindowManager.LayoutParams.TYPE_PHONE;
                }

                WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        type,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                            | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                        PixelFormat.TRANSLUCENT);
                lp.gravity = Gravity.TOP | Gravity.START;
                lp.x = 20;
                lp.y = 80;

                try {
                    wm.addView(overlay, lp);
                } catch (Throwable t) {}

                ticker = new Runnable() {
                    @Override public void run() {
                        try {
                            // محاكاة FPS عبر Choreographer-style measurement
                            long now = System.nanoTime();
                            if (lastFrame > 0) {
                                long diff = now - lastFrame;
                                int fps = (int)(1_000_000_000L / Math.max(diff, 1));
                                if (fps > 0 && fps < 200) {
                                    overlay.setText("FPS: " + fps);
                                }
                            }
                            lastFrame = now;
                        } catch (Throwable ignored) {}
                        h.postDelayed(this, 500);
                    }
                };
                h.post(ticker);
            }

            private void createChannel() {
                if (Build.VERSION.SDK_INT >= 26) {
                    NotificationChannel ch = new NotificationChannel("fps_ch",
                            "FPS Overlay", NotificationManager.IMPORTANCE_LOW);
                    NotificationManager nm = getSystemService(NotificationManager.class);
                    if (nm != null) nm.createNotificationChannel(ch);
                }
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public void onDestroy() {
                super.onDestroy();
                if (ticker != null) h.removeCallbacks(ticker);
                try { if (overlay != null && wm != null) wm.removeView(overlay); } catch (Throwable ignored) {}
            }

            @Override
            public IBinder onBind(Intent intent) { return null; }
        }
        XF

