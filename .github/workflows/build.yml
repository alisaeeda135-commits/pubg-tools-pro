            private void backupSettings() {
                try {
                    File dir = new File(getExternalFilesDir(null), "backup");
                    dir.mkdirs();
                    File f = new File(dir, "settings.json");
                    FileOutputStream fos = new FileOutputStream(f);
                    OutputStreamWriter w = new OutputStreamWriter(fos);
                    w.write("{");
                    w.write("\"theme\":\"" + prefs.getString("theme","orange") + "\",");
                    w.write("\"dpi\":\"" + prefs.getString("dpi","") + "\",");
                    w.write("\"style\":\"" + prefs.getString("style","") + "\"");
                    w.write("}");
                    w.close(); fos.close();
                    toast("تم الحفظ: " + f.getAbsolutePath());
                } catch (Throwable t) {
                    toast("فشل الحفظ: " + t.getMessage());
                }
            }

            private void restoreSettings() {
                try {
                    File f = new File(getExternalFilesDir(null), "backup/settings.json");
                    if (!f.exists()) { toast("لا يوجد ملف"); return; }
                    BufferedReader br = new BufferedReader(new java.io.FileReader(f));
                    StringBuilder sb = new StringBuilder();
                    String l;
                    while ((l = br.readLine()) != null) sb.append(l);
                    br.close();
                    toast("تم الاسترجاع. أعد التشغيل.");
                } catch (Throwable t) {
                    toast("فشل: " + t.getMessage());
                }
            }

            private String doPing(String host) {
                try {
                    Process p = Runtime.getRuntime().exec(new String[]{"ping", "-c", "4", host});
                    BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                    StringBuilder sb = new StringBuilder();
                    String l;
                    while ((l = r.readLine()) != null) sb.append(l).append("\n");
                    p.waitFor();
                    return sb.toString();
                } catch (Throwable t) { return "فشل: " + t.getMessage(); }
            }

