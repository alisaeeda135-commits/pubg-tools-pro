name: Build APK v3.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create files
      run: |
        mkdir -p app/src/main/java/com/vanta/pubgtools
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; done

        cat > settings.gradle << 'X1'
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "PUBGToolsPro"
        include ':app'
        X1

        cat > build.gradle << 'X2'
        plugins { id 'com.android.application' version '8.3.0' apply false }
        X2

        cat > gradle.properties << 'X3'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        X3

        cat > app/build.gradle << 'X4'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.vanta.pubgtools'
            compileSdk 34
            defaultConfig {
                applicationId "com.vanta.pubgtools"
                minSdk 24
                targetSdk 34
                versionCode 4
                versionName "3.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.cardview:cardview:1.0.0'
            implementation 'dev.rikka.shizuku:api:13.1.5'
            implementation 'dev.rikka.shizuku:provider:13.1.5'
        }
        X4

        cat > app/src/main/AndroidManifest.xml << 'X5'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
            <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                tools:ignore="QueryAllPackagesPermission" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/AppTheme">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <provider
                    android:name="rikka.shizuku.ShizukuProvider"
                    android:authorities="${applicationId}.shizuku"
                    android:enabled="true"
                    android:exported="true"
                    android:multiprocess="false"
                    android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
            </application>
        </manifest>
        X5

        cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'X6'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
        </adaptive-icon>
        X6
        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        cat > app/src/main/res/drawable/ic_launcher_background.xml << 'X7'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:angle="135" android:startColor="#0D0D0D"
                android:centerColor="#1A1A1A" android:endColor="#2A1500" android:type="linear" />
        </shape>
        X7

        cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'X8'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00000000" android:strokeColor="#FF6B00" android:strokeWidth="2.5"
                android:pathData="M54,22 L78,32 L78,54 C78,68 66,80 54,86 C42,80 30,68 30,54 L30,32 Z" />
            <path android:fillColor="#1A0D00" android:strokeColor="#FFA726" android:strokeWidth="1.2"
                android:pathData="M54,28 L72,36 L72,54 C72,65 63,74 54,79 C45,74 36,65 36,54 L36,36 Z" />
            <path android:fillColor="#00000000" android:strokeColor="#FF6B00" android:strokeWidth="2"
                android:pathData="M54,42 m-10,0 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0" />
            <path android:fillColor="#FFA726" android:pathData="M54,40 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0" />
        </vector>
        X8

        for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          cat > app/src/main/res/mipmap-$d/ic_launcher.xml << 'X9'
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@drawable/ic_launcher_background" />
            <item android:drawable="@drawable/ic_launcher_foreground" />
        </layer-list>
        X9
          cp app/src/main/res/mipmap-$d/ic_launcher.xml app/src/main/res/mipmap-$d/ic_launcher_round.xml
        done

        cat > app/src/main/res/values/colors.xml << 'XA'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="primary">#FF6B00</color>
            <color name="primary_dark">#E55A00</color>
            <color name="bg_dark">#0D0D0D</color>
            <color name="bg_card">#1A1A1A</color>
            <color name="bg_nav">#151515</color>
        </resources>
        XA

        cat > app/src/main/res/values/strings.xml << 'XB'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">PUBG Tools Pro</string>
        </resources>
        XB

        cat > app/src/main/res/values/themes.xml << 'XC'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">@color/primary</item>
                <item name="colorPrimaryDark">@color/primary_dark</item>
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="android:statusBarColor">@color/bg_dark</item>
                <item name="android:navigationBarColor">@color/bg_nav</item>
            </style>
        </resources>
        XC

        # ============== MAIN ACTIVITY — Bottom Nav ==============
        cat > app/src/main/java/com/vanta/pubgtools/MainActivity.java << 'XD'
        package com.vanta.pubgtools;

        import android.app.ActivityManager;
        import android.app.NotificationManager;
        import android.content.ClipData;
        import android.content.ClipboardManager;
        import android.content.Context;
        import android.content.Intent;
        import android.content.pm.ApplicationInfo;
        import android.content.pm.PackageManager;
        import android.graphics.Color;
        import android.graphics.Typeface;
        import android.graphics.drawable.GradientDrawable;
        import android.media.AudioManager;
        import android.net.ConnectivityManager;
        import android.net.NetworkInfo;
        import android.net.wifi.WifiInfo;
        import android.net.wifi.WifiManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.provider.Settings;
        import android.text.InputType;
        import android.util.DisplayMetrics;
        import android.view.Gravity;
        import android.view.View;
        import android.view.animation.ScaleAnimation;
        import android.widget.ArrayAdapter;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.FrameLayout;
        import android.widget.LinearLayout;
        import android.widget.ProgressBar;
        import android.widget.ScrollView;
        import android.widget.Spinner;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.cardview.widget.CardView;

        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.util.List;

        public class MainActivity extends AppCompatActivity {

            private LinearLayout contentArea;
            private LinearLayout navBar;
            private int activeTab = 0;

            private ActivityManager am;
            private AudioManager audioManager;
            private Handler h = new Handler(Looper.getMainLooper());
            private Runnable liveTask;

            private TextView ramLive, cpuLive, volLive, shizukuStatus;

            private int COLOR_PRIMARY = Color.parseColor("#FF6B00");
            private int COLOR_BG = Color.parseColor("#0D0D0D");
            private int COLOR_CARD = Color.parseColor("#1A1A1A");
            private int COLOR_TEXT = Color.parseColor("#FFFFFF");
            private int COLOR_TEXT_DIM = Color.parseColor("#9E9E9E");

            private int dp(float v) { return (int)(v * getResources().getDisplayMetrics().density); }
            private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

            @Override
            protected void onCreate(Bundle b) {
                super.onCreate(b);
                getWindow().setStatusBarColor(COLOR_BG);
                getWindow().setNavigationBarColor(Color.parseColor("#151515"));
                am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                LinearLayout main = new LinearLayout(this);
                main.setOrientation(LinearLayout.VERTICAL);
                main.setBackgroundColor(COLOR_BG);

                // Content area (scrollable)
                ScrollView scroll = new ScrollView(this);
                scroll.setBackgroundColor(COLOR_BG);
                LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f);
                scroll.setLayoutParams(slp);

                contentArea = new LinearLayout(this);
                contentArea.setOrientation(LinearLayout.VERTICAL);
                contentArea.setPadding(dp(16), dp(16), dp(16), dp(20));
                scroll.addView(contentArea);

                main.addView(scroll);

                // Bottom Nav
                navBar = new LinearLayout(this);
                navBar.setOrientation(LinearLayout.HORIZONTAL);
                navBar.setBackgroundColor(Color.parseColor("#151515"));
                navBar.setElevation(dp(8));
                LinearLayout.LayoutParams nlp = new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, dp(64));
                navBar.setLayoutParams(nlp);
                main.addView(navBar);

                setContentView(main);

                buildNav();
                showTab(0);
                startLive();
            }

            // ============== NAV ==============
            private void buildNav() {
                navBar.removeAllViews();
                addNavBtn(0, "🏠", "الرئيسية");
                addNavBtn(1, "🎮", "اللعب");
                addNavBtn(2, "🛠", "الأدوات");
                addNavBtn(3, "⚙", "الإعدادات");
            }

            private void addNavBtn(final int idx, String icon, String label) {
                LinearLayout btn = new LinearLayout(this);
                btn.setOrientation(LinearLayout.VERTICAL);
                btn.setGravity(Gravity.CENTER);
                btn.setLayoutParams(new LinearLayout.LayoutParams(0,
                        LinearLayout.LayoutParams.MATCH_PARENT, 1f));
                btn.setClickable(true);

                final TextView ic = new TextView(this);
                ic.setText(icon); ic.setTextSize(22); ic.setGravity(Gravity.CENTER);
                btn.addView(ic);

                final TextView lb = new TextView(this);
                lb.setText(label); lb.setTextSize(11); lb.setGravity(Gravity.CENTER);
                btn.addView(lb);

                updateNavStyle(ic, lb, idx == activeTab);

                btn.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) {
                        showTab(idx);
                        buildNav();
                    }
                });

                navBar.addView(btn);
            }

            private void updateNavStyle(TextView ic, TextView lb, boolean active) {
                ic.setTextColor(active ? COLOR_PRIMARY : COLOR_TEXT_DIM);
                lb.setTextColor(active ? COLOR_PRIMARY : COLOR_TEXT_DIM);
            }

            // ============== TAB SWITCH ==============
            private void showTab(int tab) {
                activeTab = tab;
                contentArea.removeAllViews();
                switch (tab) {
                    case 0: buildHome(); break;
                    case 1: buildGame(); break;
                    case 2: buildTools(); break;
                    case 3: buildSettings(); break;
                }
            }

            // ============== TAB 0: HOME ==============
            private void buildHome() {
                addHeader("PUBG Tools Pro", "v3.0 · الرئيسية");

                // Live monitor
                CardView mon = makeCard();
                LinearLayout mi = makeCardInner();
                addTitle(mi, "📊 المراقبة الحية");
                ramLive = new TextView(this);
                ramLive.setTextSize(14); ramLive.setTextColor(COLOR_TEXT);
                ramLive.setTypeface(Typeface.MONOSPACE);
                ramLive.setPadding(0, dp(4), 0, dp(4));
                mi.addView(ramLive);
                cpuLive = new TextView(this);
                cpuLive.setTextSize(13); cpuLive.setTextColor(COLOR_PRIMARY);
                cpuLive.setTypeface(Typeface.MONOSPACE);
                cpuLive.setPadding(0, dp(2), 0, dp(4));
                mi.addView(cpuLive);
                volLive = new TextView(this);
                volLive.setTextSize(13); volLive.setTextColor(Color.parseColor("#4CAF50"));
                volLive.setTypeface(Typeface.MONOSPACE);
                volLive.setPadding(0, dp(2), 0, dp(8));
                mi.addView(volLive);
                mon.addView(mi);
                contentArea.addView(mon);

                // Quick actions
                CardView qa = makeCard();
                LinearLayout qi = makeCardInner();
                addTitle(qi, "⚡ إجراءات سريعة");

                LinearLayout row1 = new LinearLayout(this);
                row1.setOrientation(LinearLayout.HORIZONTAL);
                row1.setLayoutParams(new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));

                Button b1 = makeBtn("🧹 تنظيف", COLOR_PRIMARY, COLOR_TEXT);
                b1.setLayoutParams(new LinearLayout.LayoutParams(0, dp(56), 1f));
                b1.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { anim(v); quickClean(); }
                });
                row1.addView(b1);
                addGapH(row1, 8);
                Button b2 = makeBtn("⚡ جيم مود", COLOR_PRIMARY, COLOR_TEXT);
                b2.setLayoutParams(new LinearLayout.LayoutParams(0, dp(56), 1f));
                b2.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { anim(v); quickGame(); }
                });
                row1.addView(b2);
                qi.addView(row1);

                addGap(qi, 8);

                LinearLayout row2 = new LinearLayout(this);
                row2.setOrientation(LinearLayout.HORIZONTAL);
                Button b3 = makeBtn("🔊 صوت 75%", COLOR_CARD, COLOR_PRIMARY);
                b3.setLayoutParams(new LinearLayout.LayoutParams(0, dp(48), 1f));
                b3.setBackground(outlineBg());
                b3.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { anim(v); setVolume75(); }
                });
                row2.addView(b3);
                addGapH(row2, 8);
                Button b4 = makeBtn("📊 معلومات", COLOR_CARD, COLOR_PRIMARY);
                b4.setLayoutParams(new LinearLayout.LayoutParams(0, dp(48), 1f));
                b4.setBackground(outlineBg());
                b4.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { showTab(3); buildNav(); }
                });
                row2.addView(b4);
                qi.addView(row2);

                qa.addView(qi);
                contentArea.addView(qa);

                // Quick result area
                final TextView result = new TextView(this);
                result.setTextSize(12); result.setTextColor(COLOR_TEXT);
                result.setTypeface(Typeface.MONOSPACE);
                result.setPadding(dp(10), dp(10), dp(10), dp(10));
                result.setBackground(monoBg());
                result.setVisibility(View.GONE);
                result.setTag("quickResult");
                contentArea.addView(result);
            }

            private void quickClean() {
                TextView out = (TextView) contentArea.findViewWithTag("quickResult");
                if (out == null) return;
                out.setText("🧹 جارٍ...");
                out.setVisibility(View.VISIBLE);
                new Thread(new Runnable() { @Override public void run() {
                    ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                    am.getMemoryInfo(mi);
                    long before = mi.availMem / (1024L*1024L);
                    shOut("am kill-all");
                    System.gc();
                    try { Thread.sleep(400); } catch (Exception ignored) {}
                    am.getMemoryInfo(mi);
                    long after = mi.availMem / (1024L*1024L);
                    long freed = after - before;
                    final String txt = "🧹 تنظيف\nقبل: " + before + " MB\nبعد: " + after + " MB\n" +
                            (freed > 0 ? "✅ حُرّر: " + freed + " MB" : "ℹ️ نظيفة");
                    runOnUiThread(new Runnable() { @Override public void run() { out.setText(txt); } });
                }}).start();
            }

            private void quickGame() {
                TextView out = (TextView) contentArea.findViewWithTag("quickResult");
                if (out == null) return;
                out.setText("⚡ تفعيل...");
                out.setVisibility(View.VISIBLE);
                new Thread(new Runnable() { @Override public void run() {
                    StringBuilder sb = new StringBuilder();
                    sb.append("⚡ جيم مود\n────────\n");
                    shOut("settings put global low_power 1"); sb.append("✓ أداء عالي\n");
                    shOut("am kill-all"); sb.append("✓ إغلاق تطبيقات\n");
                    shOut("settings put system screen_brightness_mode 0"); sb.append("✓ قفل سطوع\n");
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23 && nm.isNotificationPolicyAccessGranted()) {
                            nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                            sb.append("✓ كتم إشعارات (الصوت يعمل)\n");
                        }
                    } catch (Throwable ignored) {}
                    try {
                        int max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                        audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, (max*3)/4, 0);
                        sb.append("✓ صوت 75%\n");
                    } catch (Throwable ignored) {}
                    sb.append("────────\n🎮 جاهز");
                    final String txt = sb.toString();
                    runOnUiThread(new Runnable() { @Override public void run() { out.setText(txt); } });
                }}).start();
            }

            private void setVolume75() {
                try {
                    int max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                    audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, (max*3)/4, 0);
                    toast("الصوت على 75%");
                } catch (Throwable t) { toast("فشل"); }
            }

            // ============== TAB 1: GAME ==============
            private void buildGame() {
                addHeader("🎮 وضع اللعب", "أداء عالي · تركيز كامل");

                // Shizuku
                CardView sh = makeCard();
                LinearLayout shi = makeCardInner();
                addTitle(shi, "⚡ Shizuku");
                shizukuStatus = new TextView(this);
                shizukuStatus.setTextSize(13); shizukuStatus.setTextColor(COLOR_TEXT_DIM);
                shizukuStatus.setPadding(0, dp(4), 0, dp(8));
                shi.addView(shizukuStatus);

                Button shBtn = makeBtn("طلب صلاحيات Shizuku", COLOR_PRIMARY, COLOR_TEXT);
                shBtn.setLayoutParams(new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, dp(46)));
                shBtn.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { requestShizuku(); }
                });
                shi.addView(shBtn);
                sh.addView(shi);
                contentArea.addView(sh);

                // Game Mode
                CardView gm = makeCard();
                LinearLayout gmi = makeCardInner();
                addTitle(gmi, "⚡ الجيم مود الاحترافي");

                TextView gd = new TextView(this);
                gd.setText("• إغلاق التطبيقات الخلفية\n• كتم الإشعارات (الصوت يعمل)\n• قفل السطوع\n• وضع الأداء العالي\n• تقييد إنترنت الخلفية");
                gd.setTextSize(12); gd.setTextColor(COLOR_TEXT_DIM);
                gd.setPadding(0, dp(4), 0, dp(10));
                gmi.addView(gd);

                Button on = makeBtn("⚡ تفعيل الجيم مود", COLOR_PRIMARY, COLOR_TEXT);
                on.setLayoutParams(new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, dp(52)));
                on.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { anim(v); gameOn(); }
                });
                gmi.addView(on);
                addGap(gmi, 6);

                Button off = makeBtn("إيقاف الجيم مود", COLOR_CARD, COLOR_PRIMARY);
                off.setBackground(outlineBg());
                off.setLayoutParams(new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, dp(44)));
                off.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { gameOff(); }
                });
                gmi.addView(off);

                addGap(gmi, 8);

                final TextView out = new TextView(this);
                out.setTextSize(11); out.setTextColor(COLOR_TEXT);
                out.setTypeface(Typeface.MONOSPACE);
                out.setPadding(dp(10), dp(10), dp(10), dp(10));
                out.setBackground(monoBg());
                out.setVisibility(View.GONE);
                out.setTag("gameOut");
                gmi.addView(out);

                gm.addView(gmi);
                contentArea.addView(gm);

                // Volume control
                CardView vol = makeCard();
                LinearLayout vi = makeCardInner();
                addTitle(vi, "🔊 التحكم بالصوت");

                LinearLayout vrow = new LinearLayout(this);
                vrow.setOrientation(LinearLayout.HORIZONTAL);
                Button vUp = makeBtn("🔊 رفع", COLOR_PRIMARY, COLOR_TEXT);
                vUp.setLayoutParams(new LinearLayout.LayoutParams(0, dp(50), 1f));
                vUp.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) {
                        audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC,
                                AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                    }
                });
                vrow.addView(vUp);
                addGapH(vrow, 8);
                Button vDown = makeBtn("🔉 خفض", COLOR_CARD, COLOR_PRIMARY);
                vDown.setBackground(outlineBg());
                vDown.setLayoutParams(new LinearLayout.LayoutParams(0, dp(50), 1f));
                vDown.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) {
                        audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC,
                                AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                    }
                });
                vrow.addView(vDown);
                vi.addView(vrow);

                vol.addView(vi);
                contentArea.addView(vol);

                refreshShizukuStatus();
            }

            private void gameOn() {
                TextView out = (TextView) contentArea.findViewWithTag("gameOut");
                if (out == null) return;
                out.setText("⚡ تفعيل...");
                out.setVisibility(View.VISIBLE);
                new Thread(new Runnable() { @Override public void run() {
                    StringBuilder sb = new StringBuilder();
                    sb.append("⚡ الجيم مود\n────────\n");
                    shOut("settings put global low_power 1"); sb.append("✓ أداء عالي\n");
                    shOut("am kill-all"); sb.append("✓ إغلاق تطبيقات خلفية\n");
                    shOut("settings put system screen_brightness_mode 0"); sb.append("✓ قفل سطوع\n");
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23) {
                            if (nm.isNotificationPolicyAccessGranted()) {
                                nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                                sb.append("✓ كتم إشعارات (الصوت يعمل)\n");
                            } else {
                                sb.append("⚠ امنح صلاحية DND\n");
                                startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                            }
                        }
                    } catch (Throwable ignored) {}
                    try {
                        int max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                        audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, (max*3)/4, 0);
                        sb.append("✓ صوت 75%\n");
                    } catch (Throwable ignored) {}
                    shOut("cmd netpolicy set restrict-background true");
                    sb.append("✓ تقييد إنترنت الخلفية\n");
                    try {
                        PackageManager pm = getPackageManager();
                        List<ApplicationInfo> apps = pm.getInstalledApplications(0);
                        String self = getPackageName();
                        int stopped = 0;
                        for (ApplicationInfo app : apps) {
                            if ((app.flags & ApplicationInfo.FLAG_SYSTEM) != 0) continue;
                            if (app.packageName.equals(self)) continue;
                            if (app.packageName.contains("tencent") || app.packageName.contains("pubg")) continue;
                            shOut("am force-stop " + app.packageName);
                            stopped++;
                            if (stopped > 12) break;
                        }
                        sb.append("✓ أوقف ").append(stopped).append(" تطبيق\n");
                    } catch (Throwable t) {}
                    sb.append("────────\n🎮 جاهز — العب!");
                    final String r = sb.toString();
                    runOnUiThread(new Runnable() { @Override public void run() { out.setText(r); } });
                }}).start();
            }

            private void gameOff() {
                TextView out = (TextView) contentArea.findViewWithTag("gameOut");
                if (out == null) return;
                new Thread(new Runnable() { @Override public void run() {
                    shOut("settings put global low_power 0");
                    shOut("settings put system screen_brightness_mode 1");
                    shOut("cmd netpolicy set restrict-background false");
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23 && nm.isNotificationPolicyAccessGranted()) {
                            nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                        }
                    } catch (Throwable ignored) {}
                    runOnUiThread(new Runnable() { @Override public void run() {
                        out.setText("✓ تم إيقاف الجيم مود"); out.setVisibility(View.VISIBLE);
                    }});
                }}).start();
            }

