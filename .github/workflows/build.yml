        cat > app/src/main/java/com/vanta/pubgtools/UserService.java << 'X14'
        package com.vanta.pubgtools;

        import android.os.RemoteException;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;

        public class UserService extends IUserService.Stub {

            public UserService() {}

            @Override
            public String exec(String command) throws RemoteException {
                try {
                    Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", command});
                    BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                    BufferedReader re = new BufferedReader(new InputStreamReader(p.getErrorStream()));
                    StringBuilder sb = new StringBuilder();
                    String l;
                    while ((l = r.readLine()) != null) sb.append(l).append("\n");
                    while ((l = re.readLine()) != null) sb.append(l).append("\n");
                    p.waitFor();
                    return sb.toString();
                } catch (Throwable t) {
                    return "ERROR: " + t.getMessage();
                }
            }

            @Override
            public int getUid() throws RemoteException {
                return android.os.Process.myUid();
            }
        }
        X14

        cat > app/src/main/java/com/vanta/pubgtools/MainActivity.java << 'XD'
        package com.vanta.pubgtools;

        import android.app.ActivityManager;
        import android.app.AlertDialog;
        import android.app.NotificationChannel;
