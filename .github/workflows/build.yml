        import android.view.View;
        import android.view.animation.ScaleAnimation;
        import android.widget.ArrayAdapter;
        import android.widget.Button;
        import android.widget.CheckBox;
        import android.widget.EditText;
        import android.widget.ImageView;
        import android.widget.LinearLayout;
        import android.widget.ScrollView;
        import android.widget.Spinner;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.cardview.widget.CardView;

        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.util.ArrayList;
        import java.util.Collections;
        import java.util.Comparator;
        import java.util.HashSet;
        import java.util.List;
        import java.util.Set;

        import rikka.shizuku.Shizuku;

        public class MainActivity extends AppCompatActivity {

            private LinearLayout contentArea;
            private LinearLayout navBar;
            private int activeTab = 0;

            private ActivityManager am;
            private AudioManager audioManager;
            private Handler h = new Handler(Looper.getMainLooper());
            private Runnable liveTask;

            private TextView ramLive, cpuLive, volLive, shizukuStatus;
            private SharedPreferences prefs;

            private int COLOR_PRIMARY = Color.parseColor("#FF6B00");
            private int COLOR_PRIMARY_DARK = Color.parseColor("#E55A00");
            private final int COLOR_BG = Color.parseColor("#0D0D0D");
            private final int COLOR_CARD = Color.parseColor("#1A1A1A");
            private final int COLOR_TEXT = Color.parseColor("#FFFFFF");
            private final int COLOR_TEXT_DIM = Color.parseColor("#9E9E9E");

            private static final int SHIZUKU_PERMISSION_CODE = 1001;
            private IUserService userService = null;
            private boolean isBound = false;
            private Shizuku.UserServiceArgs userServiceArgs = null;

            private int dp(float v) { return (int)(v * getResources().getDisplayMetrics().density); }
            private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

            private final ServiceConnection serviceConnection = new ServiceConnection() {
                @Override public void onServiceConnected(ComponentName name, IBinder binder) {
                    userService = IUserService.Stub.asInterface(binder);
                    isBound = true;
                    runOnUiThread(new Runnable() {
                        @Override public void run() {
                            refreshShizukuStatus();
                            toast("Shizuku UserService متصل ✓");
                        }
                    });
                }
                @Override public void onServiceDisconnected(ComponentName name) {
                    userService = null;
                    isBound = false;
                }
            };

            private final Shizuku.OnRequestPermissionResultListener permListener =
                new Shizuku.OnRequestPermissionResultListener() {
                    @Override public void onRequestPermissionResult(int requestCode, int grantResult) {
                        if (requestCode == SHIZUKU_PERMISSION_CODE) {
                            if (grantResult == PackageManager.PERMISSION_GRANTED) {
                                bindUserService();
                                runOnUiThread(new Runnable() {
                                    @Override public void run() {
                                        refreshShizukuStatus();
                                        toast("تم منح صلاحيات Shizuku");
                                    }
                                });
                            }
                        }
                    }
                };

            @Override
            protected void onCreate(Bundle b) {
                super.onCreate(b);
                prefs = getSharedPreferences("pubgtools", MODE_PRIVATE);
                loadTheme();
                getWindow().setStatusBarColor(COLOR_BG);
                getWindow().setNavigationBarColor(COLOR_BG);
                am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                createNotificationChannel();

                LinearLayout main = new LinearLayout(this);
                main.setOrientation(LinearLayout.VERTICAL);
                main.setBackgroundColor(COLOR_BG);

                ScrollView scroll = new ScrollView(this);
                scroll.setBackgroundColor(COLOR_BG);
                LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f);
                scroll.setLayoutParams(slp);

                contentArea = new LinearLayout(this);
                contentArea.setOrientation(LinearLayout.VERTICAL);
                contentArea.setPadding(dp(16), dp(16), dp(16), dp(20));
                scroll.addView(contentArea);
                main.addView(scroll);

                navBar = new LinearLayout(this);
                navBar.setOrientation(LinearLayout.HORIZONTAL);
                navBar.setBackgroundColor(Color.parseColor("#151515"));
                navBar.setElevation(dp(8));
                LinearLayout.LayoutParams nlp = new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, dp(64));
                navBar.setLayoutParams(nlp);
                main.addView(navBar);

                setContentView(main);

                // Shizuku UserServiceArgs
                try {
                    userServiceArgs = new Shizuku.UserServiceArgs(
                        new ComponentName(getPackageName(), UserService.class.getName()))
                        .daemon(false)
                        .processNameSuffix("service")
                        .debuggable(false)
                        .version(1);
                } catch (Throwable ignored) {}

                setupShizuku();
                buildNav();
                showTab(0);
                startLive();
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= 26) {
                    NotificationChannel ch = new NotificationChannel("pubg_ch",
                            "PUBG Tools", NotificationManager.IMPORTANCE_LOW);
                    NotificationManager nm = getSystemService(NotificationManager.class);
                    if (nm != null) nm.createNotificationChannel(ch);
                }
            }

            private void setupShizuku() {
                try {
                    Shizuku.addRequestPermissionResultListener(permListener);
                    if (Shizuku.pingBinder()) {
                        if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                            bindUserService();
                        }
                    }
                } catch (Throwable ignored) {}
            }

            private void bindUserService() {
                try {
                    if (userServiceArgs == null) return;
                    Shizuku.bindUserService(userServiceArgs, serviceConnection);
                } catch (Throwable t) {
                    toast("فشل الربط: " + t.getMessage());
                }
            }

            private void requestShizuku() {
                try {
                    if (!Shizuku.pingBinder()) {
                        toast("Shizuku غير مثبت أو غير شغّال");
                        return;
                    }
                    if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                        bindUserService();
                        toast("مربوط بالفعل");
                        return;
                    }
                    Shizuku.requestPermission(SHIZUKU_PERMISSION_CODE);
                } catch (Throwable t) {
                    toast("خطأ: " + t.getMessage());
                }
            }

            private void refreshShizukuStatus() {
                if (shizukuStatus == null) return;
                try {
                    if (!Shizuku.pingBinder()) {
                        shizukuStatus.setText("✗ Shizuku غير مثبت");
                        shizukuStatus.setTextColor(Color.parseColor("#F44336"));
                        return;
                    }
                    if (isBound && userService != null) {
                        int uid = -1;
                        try { uid = userService.getUid(); } catch (Throwable ignored) {}
                        shizukuStatus.setText("✓ متصل (uid=" + uid + ")");
                        shizukuStatus.setTextColor(Color.parseColor("#4CAF50"));
                    } else if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                        shizukuStatus.setText("⏳ الصلاحيات ممنوحة — ربط...");
                        shizukuStatus.setTextColor(COLOR_PRIMARY);
                        bindUserService();
                    } else {
                        shizukuStatus.setText("⚠ Shizuku شغّال — اطلب الصلاحيات");
                        shizukuStatus.setTextColor(COLOR_PRIMARY);
                    }
                } catch (Throwable t) {
                    shizukuStatus.setText("Shizuku غير مثبت");
                    shizukuStatus.setTextColor(Color.parseColor("#F44336"));
                }
            }

            private void loadTheme() {
                String t = prefs.getString("theme", "orange");
                switch (t) {
                    case "blue": COLOR_PRIMARY = Color.parseColor("#2196F3"); COLOR_PRIMARY_DARK = Color.parseColor("#1565C0"); break;
                    case "green": COLOR_PRIMARY = Color.parseColor("#4CAF50"); COLOR_PRIMARY_DARK = Color.parseColor("#2E7D32"); break;
                    case "red": COLOR_PRIMARY = Color.parseColor("#F44336"); COLOR_PRIMARY_DARK = Color.parseColor("#C62828"); break;
                    default: COLOR_PRIMARY = Color.parseColor("#FF6B00"); COLOR_PRIMARY_DARK = Color.parseColor("#E55A00");
                }
            }

            private String execCmd(String cmd) {
                if (isBound && userService != null) {
                    try { return userService.exec(cmd); } catch (Throwable t) { return "ERROR: " + t.getMessage(); }
                }
                try {
                    Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", cmd});
                    BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                    BufferedReader re = new BufferedReader(new InputStreamReader(p.getErrorStream()));
                    StringBuilder sb = new StringBuilder();
                    String l;
                    while ((l = r.readLine()) != null) sb.append(l).append("\n");
                    while ((l = re.readLine()) != null) sb.append(l).append("\n");
                    p.waitFor();
                    return sb.toString();
                } catch (Throwable t) { return ""; }
            }

            private void buildNav() {
                navBar.removeAllViews();
                addNavBtn(0, "🏠", "الرئيسية");
                addNavBtn(1, "🎮", "اللعب");
                addNavBtn(2, "🛠", "الأدوات");
                addNavBtn(3, "⚙", "الإعدادات");
            }

            private void addNavBtn(final int idx, String icon, String label) {
                LinearLayout btn = new LinearLayout(this);
                btn.setOrientation(LinearLayout.VERTICAL);
                btn.setGravity(Gravity.CENTER);
                btn.setLayoutParams(new LinearLayout.LayoutParams(0,
                        LinearLayout.LayoutParams.MATCH_PARENT, 1f));
                btn.setClickable(true);
                final TextView ic = new TextView(this);
                ic.setText(icon); ic.setTextSize(22); ic.setGravity(Gravity.CENTER);
                btn.addView(ic);
                final TextView lb = new TextView(this);
                lb.setText(label); lb.setTextSize(11); lb.setGravity(Gravity.CENTER);
                btn.addView(lb);
                boolean active = (idx == activeTab);
                ic.setTextColor(active ? COLOR_PRIMARY : COLOR_TEXT_DIM);
                lb.setTextColor(active ? COLOR_PRIMARY : COLOR_TEXT_DIM);
                btn.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) { showTab(idx); buildNav(); }
                });
                navBar.addView(btn);
            }

            private void showTab(int tab) {
                activeTab = tab;
                contentArea.removeAllViews();
                switch (tab) {
                    case 0: buildHome(); break;
                    case 1: buildGame(); break;
                    case 2: buildTools(); break;
                    case 3: buildSettings(); break;
                }
            }

