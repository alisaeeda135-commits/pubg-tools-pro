    - name: Build APK
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        gradle assembleDebug --no-daemon 2>&1 | tee build.log | tail -100
        echo ""
        echo "=== CHECK FOR APK ==="
        find . -name "*.apk" -type f
        echo ""
        echo "=== BUILD LOG TAIL ==="
        tail -50 build.log

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pubg-tools-apk
        path: app/build/outputs/apk/debug/*.apk
