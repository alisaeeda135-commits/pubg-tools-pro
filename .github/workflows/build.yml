            private void refreshShizukuStatus() {
                try {
                    Class<?> clazz = Class.forName("rikka.shizuku.Shizuku");
                    Boolean alive = (Boolean) clazz.getMethod("pingBinder").invoke(null);
                    if (alive != null && alive) {
                        shizukuStatus.setText("✓ Shizuku شغّال — جاهز للصلاحيات");
                        shizukuStatus.setTextColor(Color.parseColor("#4CAF50"));
                    } else {
                        shizukuStatus.setText("✗ Shizuku مثبت لكن مو شغّال");
                        shizukuStatus.setTextColor(Color.parseColor("#F44336"));
                    }
                } catch (Throwable t) {
                    shizukuStatus.setText("Shizuku غير مثبت");
                    shizukuStatus.setTextColor(Color.parseColor("#F44336"));
                }
            }

            private void requestShizuku() {
                try {
                    Class<?> sc = Class.forName("rikka.shizuku.Shizuku");
                    Class<?> lc = Class.forName("rikka.shizuku.Shizuku$OnRequestPermissionResultListener");
                    Object listener = java.lang.reflect.Proxy.newProxyInstance(
                            lc.getClassLoader(), new Class[]{lc},
                            new java.lang.reflect.InvocationHandler() {
                                @Override public Object invoke(Object proxy, java.lang.reflect.Method m, Object[] args) {
                                    runOnUiThread(new Runnable() {
                                        @Override public void run() {
                                            refreshShizukuStatus();
                                            toast("تم تفعيل Shizuku");
                                        }
                                    });
                                    return null;
                                }
                            });
                    sc.getMethod("addRequestPermissionResultListener", lc).invoke(null, listener);
                    sc.getMethod("requestPermission", int.class).invoke(null, 0);
                    toast("في انتظار الموافقة");
                } catch (Throwable t) {
                    toast("Shizuku غير مثبت");
                    refreshShizukuStatus();
                }
            }

            private void startLive() {
                liveTask = new Runnable() {
                    @Override public void run() {
                        try {
                            ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                            am.getMemoryInfo(mi);
                            long tot = mi.totalMem / (1024L*1024L);
                            long av = mi.availMem / (1024L*1024L);
                            long us = tot - av;
                            int pct = (int)((us * 100) / tot);
                            ramLive.setText("🧠 RAM: " + us + " / " + tot + " MB  (" + pct + "%)");
                            ramBar.setProgress(pct);
                            int cores = Runtime.getRuntime().availableProcessors();
                            long heap = Runtime.getRuntime().totalMemory() / (1024L*1024L);
                            cpuLive.setText("⚙ الأنوية: " + cores + "  ·  JVM: " + heap + " MB");
                        } catch (Throwable ignored) {}
                        h.postDelayed(this, 1000);
                    }
                };
                h.post(liveTask);
            }

            @Override protected void onDestroy() {
                super.onDestroy();
                if (liveTask != null) h.removeCallbacks(liveTask);
            }

            private void anim(View v) {
                ScaleAnimation sa = new ScaleAnimation(1f, 0.95f, 1f, 0.95f,
                        ScaleAnimation.RELATIVE_TO_SELF, 0.5f, ScaleAnimation.RELATIVE_TO_SELF, 0.5f);
                sa.setDuration(100);
                sa.setRepeatCount(1);
                sa.setRepeatMode(ScaleAnimation.REVERSE);
                v.startAnimation(sa);
            }

            private void cleanMemory(final TextView out) {
                out.setText("🧹 جارٍ التنظيف...");
                out.setVisibility(View.VISIBLE);
                new Thread(new Runnable() { @Override public void run() {
                    StringBuilder sb = new StringBuilder();
                    sb.append("🧹 تنظيف الذاكرة\n─────────────\n");
                    ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                    am.getMemoryInfo(mi);
                    long before = mi.availMem / (1024L*1024L);
                    shOut("am kill-all");
                    sb.append("✓ إشارة kill-all\n");
                    System.gc();
                    try { Thread.sleep(500); } catch (Exception ignored) {}
                    am.getMemoryInfo(mi);
                    long after = mi.availMem / (1024L*1024L);
                    long freed = after - before;
                    sb.append("─────────────\n");
                    sb.append("📊 قبل: ").append(before).append(" MB\n");
                    sb.append("📊 بعد: ").append(after).append(" MB\n");
                    if (freed > 0) sb.append("✅ حُرّر: ").append(freed).append(" MB");
                    else sb.append("ℹ️ الذاكرة كانت نظيفة");
                    final String r = sb.toString();
                    runOnUiThread(new Runnable() { @Override public void run() { out.setText(r); } });
                }}).start();
            }

            private void gameOn(final TextView out) {
                out.setText("⚡ تفعيل...");
                out.setVisibility(View.VISIBLE);
                new Thread(new Runnable() { @Override public void run() {
                    StringBuilder sb = new StringBuilder();
                    sb.append("⚡ الجيم مود\n─────────────\n");
                    shOut("settings put global low_power 1");
                    sb.append("✓ وضع الأداء العالي\n");
                    shOut("am kill-all");
                    sb.append("✓ إغلاق التطبيقات الخلفية\n");
                    shOut("settings put system screen_brightness_mode 0");
                    sb.append("✓ قفل السطوع\n");

                    // Try DND
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23) {
                            if (nm.isNotificationPolicyAccessGranted()) {
                                nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                                sb.append("✓ كتم الإشعارات (DND)\n");
                            } else {
                                sb.append("⚠ امنح صلاحية DND\n");
                                startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                            }
                        }
                    } catch (Throwable ignored) {}

                    // Restrict background data
                    shOut("cmd netpolicy set restrict-background true");
                    sb.append("✓ تقييد إنترنت الخلفية\n");

                    try {
                        PackageManager pm = getPackageManager();
                        List<ApplicationInfo> apps = pm.getInstalledApplications(0);
                        String self = getPackageName();
                        int stopped = 0;
                        for (ApplicationInfo app : apps) {
                            if ((app.flags & ApplicationInfo.FLAG_SYSTEM) != 0) continue;
                            if (app.packageName.equals(self)) continue;
                            if (app.packageName.contains("tencent") || app.packageName.contains("pubg")) continue;
                            shOut("am force-stop " + app.packageName);
                            stopped++;
                            if (stopped > 12) break;
                        }
                        sb.append("✓ إيقاف ").append(stopped).append(" تطبيق\n");
                    } catch (Throwable t) { sb.append("⚠ بعض التطبيقات ما توقفت\n"); }
                    sb.append("─────────────\n🎮 جاهز للعب");
                    final String r = sb.toString();
                    runOnUiThread(new Runnable() { @Override public void run() { out.setText(r); } });
                }}).start();
            }

            private void gameOff(final TextView out) {
                new Thread(new Runnable() { @Override public void run() {
                    shOut("settings put global low_power 0");
                    shOut("settings put system screen_brightness_mode 1");
                    shOut("cmd netpolicy set restrict-background false");
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23 && nm.isNotificationPolicyAccessGranted()) {
                            nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                        }
                    } catch (Throwable ignored) {}
                    final String r = "✓ تم الإيقاف — كل شي رجع طبيعي";
                    runOnUiThread(new Runnable() { @Override public void run() {
                        out.setText(r); out.setVisibility(View.VISIBLE);
                    }});
                }}).start();
            }

            private String shOut(String cmd) {
                try {
                    Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", cmd});
                    BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                    StringBuilder sb = new StringBuilder();
                    String l;
                    while ((l = r.readLine()) != null) sb.append(l).append("\n");
                    p.waitFor();
                    return sb.toString();
                } catch (Throwable t) { return ""; }
            }

            private void fillNet(TextView tv) {
                try {
                    ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                    NetworkInfo ni = cm.getActiveNetworkInfo();
                    StringBuilder sb = new StringBuilder();
                    if (ni != null && ni.isConnected()) sb.append("النوع: ").append(ni.getTypeName()).append("\n");
                    else sb.append("غير متصل\n");
                    WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                    if (wm != null && wm.isWifiEnabled()) {
                        WifiInfo wi = wm.getConnectionInfo();
                        if (wi != null) sb.append("WiFi: ").append(wi.getSSID()).append("\n");
                    }
                    tv.setText(sb.toString());
                } catch (Throwable ignored) {}
            }

            private String computeSens(int dpi, int idx) {
                double sf; String sn;
                switch (idx) {
                    case 0: sf = 1.15; sn = "2 أصابع"; break;
                    case 1: sf = 1.05; sn = "3 أصابع"; break;
                    case 2: sf = 0.95; sn = "4 أصابع"; break;
                    case 3: sf = 0.88; sn = "5 أصابع"; break;
                    case 4: sf = 0.80; sn = "جيروسكوب"; break;
                    default: sf = 1.0; sn = "-";
                }
                double df = 450.0 / dpi;
                StringBuilder sb = new StringBuilder();
                sb.append("DPI: ").append(dpi).append("\n");
                sb.append("النمط: ").append(sn).append("\n─────────────\n");
                sb.append("🎯 الكاميرا: ").append(clamp((int)(90*df*sf))).append("\n");
                sb.append("🎯 ADS: ").append(clamp((int)(55*df*sf))).append("\n");
                sb.append("🎯 TPP: ").append(clamp((int)(60*df*sf))).append("\n");
                sb.append("🎯 FPP: ").append(clamp((int)(65*df*sf))).append("\n");
                sb.append("🎯 الجيروسكوب: ").append(clamp((int)(300*df*sf))).append("\n");
                return sb.toString();
            }
            private int clamp(int v) { return Math.max(1, Math.min(300, v)); }

