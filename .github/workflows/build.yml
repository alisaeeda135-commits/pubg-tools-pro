            private void openAppSelector() {
                PackageManager pm = getPackageManager();
                List<ApplicationInfo> apps = pm.getInstalledApplications(0);
                List<ApplicationInfo> userApps = new ArrayList<>();
                for (ApplicationInfo ai : apps) {
                    if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) == 0) userApps.add(ai);
                }
                Collections.sort(userApps, new Comparator<ApplicationInfo>() {
                    @Override public int compare(ApplicationInfo a, ApplicationInfo b) {
                        PackageManager p = getPackageManager();
                        return p.getApplicationLabel(a).toString()
                                .compareToIgnoreCase(p.getApplicationLabel(b).toString());
                    }
                });

                Set<String> saved = prefs.getStringSet("kill_apps", new HashSet<String>());

                ScrollView sv = new ScrollView(this);
                LinearLayout ll = new LinearLayout(this);
                ll.setOrientation(LinearLayout.VERTICAL);
                ll.setPadding(dp(16), dp(16), dp(16), dp(16));
                ll.setBackgroundColor(COLOR_BG);
                TextView title = new TextView(this);
                title.setText("اختر التطبيقات (" + userApps.size() + "):");
                title.setTextSize(16); title.setTextColor(COLOR_PRIMARY);
                title.setTypeface(null, Typeface.BOLD);
                title.setPadding(0, 0, 0, dp(12));
                ll.addView(title);

                final List<CheckBox> boxes = new ArrayList<>();
                final List<String> pkgs = new ArrayList<>();

                for (ApplicationInfo ai : userApps) {
                    LinearLayout row = new LinearLayout(this);
                    row.setOrientation(LinearLayout.HORIZONTAL);
                    row.setGravity(Gravity.CENTER_VERTICAL);
                    row.setPadding(dp(6), dp(8), dp(6), dp(8));

                    ImageView iv = new ImageView(this);
                    try { iv.setImageDrawable(pm.getApplicationIcon(ai)); } catch (Throwable t) {}
                    LinearLayout.LayoutParams ilp = new LinearLayout.LayoutParams(dp(42), dp(42));
                    ilp.setMargins(0, 0, dp(12), 0);
                    iv.setLayoutParams(ilp);
                    row.addView(iv);

                    LinearLayout textCol = new LinearLayout(this);
                    textCol.setOrientation(LinearLayout.VERTICAL);
                    textCol.setLayoutParams(new LinearLayout.LayoutParams(0,
                            LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                    TextView nameTv = new TextView(this);
                    nameTv.setText(pm.getApplicationLabel(ai));
                    nameTv.setTextColor(COLOR_TEXT);
                    nameTv.setTextSize(14);
                    nameTv.setTypeface(null, Typeface.BOLD);
                    textCol.addView(nameTv);
                    TextView pkgTv = new TextView(this);
                    pkgTv.setText(ai.packageName);
                    pkgTv.setTextColor(COLOR_TEXT_DIM);
                    pkgTv.setTextSize(10);
                    textCol.addView(pkgTv);
                    row.addView(textCol);

                    final CheckBox cb = new CheckBox(this);
                    cb.setChecked(saved.contains(ai.packageName));
                    if (Build.VERSION.SDK_INT >= 21) cb.setButtonTintList(ColorStateList.valueOf(COLOR_PRIMARY));
                    row.addView(cb);

                    pkgs.add(ai.packageName);
                    boxes.add(cb);

                    row.setClickable(true);
                    row.setOnClickListener(new View.OnClickListener() {
                        @Override public void onClick(View v) { cb.toggle(); }
                    });
                    ll.addView(row);
                }

                Button save = makeBtn("حفظ الاختيار", COLOR_PRIMARY, COLOR_TEXT);
                save.setLayoutParams(new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, dp(50)));
                ll.addView(save);
                sv.addView(ll);
                final AlertDialog dlg = new AlertDialog.Builder(this).setView(sv).create();
                save.setOnClickListener(new View.OnClickListener() {
                    @Override public void onClick(View v) {
                        Set<String> sel = new HashSet<>();
                        for (int i = 0; i < boxes.size(); i++) {
                            if (boxes.get(i).isChecked()) sel.add(pkgs.get(i));
                        }
                        prefs.edit().putStringSet("kill_apps", sel).apply();
                        toast("تم حفظ " + sel.size() + " تطبيق");
                        dlg.dismiss();
                    }
                });
                dlg.show();
            }

            private void gameOn() {
                final TextView out = (TextView) contentArea.findViewWithTag("gameOut");
                if (out == null) return;
                out.setText("⚡ تفعيل...");
                out.setVisibility(View.VISIBLE);
                new Thread(new Runnable() { @Override public void run() {
                    StringBuilder sb = new StringBuilder();
                    sb.append("⚡ الجيم مود\n────────\n");
                    sb.append(isBound ? "✓ Shizuku نشط\n" : "⚠ بدون Shizuku\n");
                    sb.append(checkOut(execCmd("settings put global low_power 1"), "أداء عالي"));
                    sb.append(checkOut(execCmd("am kill-all"), "kill-all"));
                    sb.append(checkOut(execCmd("settings put system screen_brightness_mode 0"), "قفل سطوع"));
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23 && nm.isNotificationPolicyAccessGranted()) {
                            nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                            sb.append("✓ كتم إشعارات\n");
                        }
                    } catch (Throwable ignored) {}
                    try {
                        int max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                        audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, (max*3)/4, 0);
                        sb.append("✓ صوت 75%\n");
                    } catch (Throwable ignored) {}
                    sb.append(checkOut(execCmd("cmd netpolicy set restrict-background true"), "تقييد إنترنت"));
                    Set<String> selected = prefs.getStringSet("kill_apps", new HashSet<String>());
                    if (!selected.isEmpty()) {
                        int ok = 0, fail = 0;
                        for (String pkg : selected) {
                            if (pkg.equals(getPackageName())) continue;
                            String r = execCmd("am force-stop " + pkg);
                            if (r == null || (!r.toLowerCase().contains("error") && !r.toLowerCase().contains("exception"))) ok++;
                            else fail++;
                        }
                        sb.append("✓ أوقف ").append(ok);
                        if (fail > 0) sb.append(" (").append(fail).append(" فشل)");
                        sb.append("\n");
                    }
                    sb.append("────────\n🎮 جاهز");
                    final String r = sb.toString();
                    runOnUiThread(new Runnable() { @Override public void run() { out.setText(r); } });
                }}).start();
            }

            private String checkOut(String r, String label) {
                if (r == null) return "✗ " + label + "\n";
                String low = r.toLowerCase();
                if (low.contains("error") || low.contains("exception") ||
                    low.contains("denied") || low.contains("not found")) {
                    return "✗ " + label + "\n";
                }
                return "✓ " + label + "\n";
            }

            private void gameOff() {
                final TextView out = (TextView) contentArea.findViewWithTag("gameOut");
                if (out == null) return;
                new Thread(new Runnable() { @Override public void run() {
                    execCmd("settings put global low_power 0");
                    execCmd("settings put system screen_brightness_mode 1");
                    execCmd("cmd netpolicy set restrict-background false");
                    try {
                        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                        if (Build.VERSION.SDK_INT >= 23 && nm.isNotificationPolicyAccessGranted()) {
                            nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                        }
                    } catch (Throwable ignored) {}
                    runOnUiThread(new Runnable() { @Override public void run() {
                        out.setText("✓ تم إيقاف الجيم مود"); out.setVisibility(View.VISIBLE);
                    }});
                }}).start();
            }

