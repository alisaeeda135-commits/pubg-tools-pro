    - name: Verify SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls -la /usr/local/lib/android/sdk/ 2>/dev/null | head -5
        ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null
        ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null

    - name: Build APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle assembleDebug --no-daemon 2>&1 | tail -80

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pubg-tools-apk
        path: app/build/outputs/apk/debug/*.apk
